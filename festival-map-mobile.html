<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>국제차문화대전 부스배치도</title>
<script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark');</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #1c1c1c; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; touch-action: none; }

  /* ── 상단 바 ── */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    height: 52px;
    background: rgba(245,240,232,0.97);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center;
    padding: 0 4px 0 12px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .top-back { color: #666; text-decoration: none; font-size: 13px; padding: 8px 8px 8px 0; white-space: nowrap; }
  .top-title { flex: 1; text-align: center; font-size: 14px; font-weight: bold; color: #2c2c2c; padding: 0 8px; }
  .top-search-btn {
    background: none; border: none; font-size: 19px; padding: 8px 10px;
    cursor: pointer; line-height: 1; flex-shrink: 0;
  }

  /* ── 검색 패널 ── */
  .search-panel {
    position: fixed; top: 81px; left: 0; right: 0; z-index: 110;
    background: rgba(245,240,232,0.98);
    padding: 8px 14px 10px;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    transform: translateY(-200%);
    transition: transform 0.22s ease;
  }
  .search-panel.open { transform: translateY(0); }
  .search-panel input {
    width: 100%; padding: 9px 16px;
    border: 1px solid #ccc; border-radius: 22px;
    font-size: 14px; font-family: inherit;
    background: white; outline: none;
    -webkit-appearance: none;
  }
  .search-panel input:focus { border-color: #6aaa6a; }

  /* ── 지도 영역 ── */
  .map-area {
    position: fixed; top: 81px; left: 0; right: 0; bottom: 0;
    overflow: hidden; touch-action: none;
    cursor: grab;
  }
  .map-area.active { cursor: grabbing; }
  .map-area.search-open { top: 133px; }

  /* ── 지도 무버 ── */
  .map-mover {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  .map-mover svg { display: block; }

  /* ── 로딩 ── */
  #svgLoading {
    color: #aaa; font-size: 14px; padding: 60px 20px; text-align: center; white-space: nowrap;
  }

  /* ── SVG 부스 오버라이드 ── */
  .bLabel { pointer-events: none !important; }
  .booth-rect { cursor: pointer !important; }
  .booth-rect.selected {
    fill: #ff6b35 !important;
    stroke: #c0392b !important;
    stroke-width: 2 !important;
  }
  .booth-rect.highlight {
    stroke: #e85c00 !important;
    stroke-width: 2.5 !important;
    filter: brightness(0.75) saturate(1.5);
  }
  .booth-rect.visited {
    stroke: #2e8b57 !important;
    stroke-width: 2.5 !important;
    opacity: 0.55;
  }
  .visited-badge, .memo-dot { pointer-events: none; }

  /* ── 바텀 시트 ── */
  .bottom-sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 10px 20px 36px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.14);
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  }
  .bottom-sheet.open { transform: translateY(0); }
  .bs-handle {
    width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px;
    margin: 0 auto 14px;
  }
  .bs-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bs-zone-tag {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 11px; font-weight: bold; color: white; letter-spacing: 0.3px;
  }
  .bs-id { font-size: 12px; color: #999; }
  .bs-name {
    font-size: 16px; font-weight: bold; color: #1a1a1a;
    line-height: 1.5; margin-bottom: 18px;
  }
  .bs-btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: bold; font-family: inherit;
    cursor: pointer; transition: opacity 0.12s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .bs-btn:active { opacity: 0.82; transform: scale(0.98); }
  .bs-btn.add  { background: #ff6b35; color: white; }
  .bs-btn.remove { background: #f0f0f0; color: #888; }
  .bs-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .bs-actions .bs-btn { flex: 1; padding: 13px; font-size: 14px; }
  .bs-btn.wish-off  { background: #fff0e8; color: #e8651e; border: 1.5px solid #f3c4a8; }
  .bs-btn.wish-on   { background: #ff6b35; color: white; }
  .bs-btn.visit-off { background: #eef7f0; color: #2e8b57; border: 1.5px solid #b8ddc4; }
  .bs-btn.visit-on  { background: #2e8b57; color: white; }
  .bs-memo-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .bs-memo {
    width: 100%; min-height: 64px; padding: 11px 13px;
    border: 1px solid #ddd; border-radius: 12px;
    font-size: 14px; font-family: inherit; resize: none; outline: none;
    -webkit-appearance: none;
  }
  .bs-memo:focus { border-color: #6aaa6a; }

  /* ── FAB ── */
  .fab {
    position: fixed; bottom: 28px; right: 18px; z-index: 90;
    width: 58px; height: 58px; border-radius: 29px;
    background: #4a90a4; color: white;
    border: none; cursor: pointer;
    box-shadow: 0 4px 18px rgba(74,144,164,0.55);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .fab:active { transform: scale(0.91); }
  .fab-icon { font-size: 22px; }
  .fab-badge {
    position: absolute; top: -3px; right: -3px;
    background: #e05c5c; color: white;
    font-size: 11px; font-weight: bold;
    border-radius: 10px; padding: 2px 6px; min-width: 20px;
    text-align: center; line-height: 1.4;
    display: none; font-family: inherit;
  }
  .fab-badge.visible { display: block; }

  /* ── 방문 리스트 드로어 ── */
  .wishlist-drawer {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
    background: #f5f0e8;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  }
  .wishlist-drawer.open { transform: translateY(0); }
  .wd-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 56px 20px 16px;
    background: white;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }
  .wd-title { font-size: 17px; font-weight: bold; color: #1a1a1a; }
  .wd-close {
    background: none; border: none; font-size: 22px;
    cursor: pointer; color: #aaa; padding: 4px 6px; line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .wd-list { flex: 1; overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; }
  .wd-item {
    display: flex; align-items: center; gap: 10px;
    background: white; border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .wd-zone-dot {
    width: 30px; height: 30px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: white; flex-shrink: 0;
  }
  .wd-info { flex: 1; min-width: 0; }
  .wd-item-id { font-size: 11px; color: #6aaa6a; font-weight: bold; margin-bottom: 2px; }
  .wd-item-name { font-size: 13px; color: #2c2c2c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wd-item-memo {
    font-size: 11.5px; color: #999; line-height: 1.35; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .wd-remove { color: #ccc; font-size: 18px; padding: 4px; flex-shrink: 0; line-height: 1; }
  .wd-empty { text-align: center; color: #bbb; font-size: 14px; padding: 60px 20px; line-height: 2.2; }
  .wd-actions {
    padding: 12px 14px 36px; display: flex; flex-wrap: wrap; gap: 8px;
    background: white; border-top: 1px solid #eee; flex-shrink: 0;
  }
  .wd-btn {
    flex: 1 1 calc(50% - 4px); padding: 13px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: bold; font-family: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.12s;
  }
  .wd-btn:active:not(:disabled) { opacity: 0.8; }
  .wd-btn-share { background: #6b5bd4; color: white; }
  .wd-btn-copy { background: #eef0fb; color: #4a4a8a; border: 1px solid #d5d8f0; }
  .wd-btn-save { background: #4a90a4; color: white; }
  .wd-btn-clear { background: #f0f0f0; color: #999; }
  .wd-btn:disabled { opacity: 0.35; cursor: default; }

  /* ── 데스크톱 권장 배너 ── */
  .desktop-notice {
    position: fixed; top: 52px; left: 0; right: 0; z-index: 48;
    background: #fdf8ee;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    text-align: center;
    font-size: 11.5px; color: #9a8760;
    padding: 5px 16px; line-height: 1.45;
  }

  /* ── 다크 모드 토글 버튼 ── */
  .top-dark-btn {
    background: none; border: none; font-size: 18px; padding: 8px 8px 8px 4px;
    cursor: pointer; line-height: 1; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 다크 모드 ── */
  html.dark .top-bar {
    background: rgba(30,30,32,0.97);
    border-bottom-color: rgba(255,255,255,0.08);
  }
  html.dark .top-back { color: #aaa; }
  html.dark .top-title { color: #e0e0e0; }
  html.dark .search-panel {
    background: rgba(30,30,32,0.98);
    border-bottom-color: rgba(255,255,255,0.06);
  }
  html.dark .search-panel input { background: #2e2e2e; border-color: #444; color: #e0e0e0; }
  html.dark .search-panel input::placeholder { color: #555; }
  html.dark .bottom-sheet { background: #242424; }
  html.dark .bs-handle { background: #444; }
  html.dark .bs-id { color: #666; }
  html.dark .bs-name { color: #e0e0e0; }
  html.dark .bs-btn.remove { background: #333; color: #888; }
  html.dark .bs-btn.wish-off  { background: #3a2a20; color: #e8965e; border-color: #5a4030; }
  html.dark .bs-btn.visit-off { background: #1f2e24; color: #6abb8a; border-color: #355040; }
  html.dark .bs-memo-label { color: #777; }
  html.dark .bs-memo { background: #2e2e2e; border-color: #444; color: #e0e0e0; }
  html.dark .wishlist-drawer { background: #1a1a1a; }
  html.dark .wd-header { background: #242424; border-bottom-color: #333; }
  html.dark .wd-title { color: #e0e0e0; }
  html.dark .wd-close { color: #555; }
  html.dark .wd-item { background: #2e2e2e; }
  html.dark .wd-item-name { color: #d0d0d0; }
  html.dark .wd-item-memo { color: #888; }
  html.dark .wd-remove { color: #444; }
  html.dark .wd-empty { color: #555; }
  html.dark .wd-actions { background: #242424; border-top-color: #333; }
  html.dark .wd-btn-clear { background: #333; color: #888; }
  html.dark .wd-btn-share { background: #5a4cc0; }
  html.dark .wd-btn-copy { background: #2a2a3a; color: #aab; border-color: #3a3a50; }
  html.dark .desktop-notice { background: #252520; color: #7a7760; border-bottom-color: rgba(255,255,255,0.05); }
  html.dark .onboarding-overlay { background: rgba(0,0,0,0.72); }
  html.dark .onboarding-box { background: #242424; }
  html.dark .onboarding-title { color: #e0e0e0; }
  html.dark .ob-item { color: #bbb; }
  /* SVG 다크 오버라이드 (fetch 후 주입된 SVG에 적용) */
  html.dark #mapSvg > rect:first-child { fill: #1e1e1e; }
  html.dark #mapSvg > rect:nth-child(2) { stroke: #555; }
  html.dark #mapSvg text:not(.bLabel):not(.bName) { fill: #aaa !important; }

  /* ── 온보딩 팝업 ── */
  .onboarding-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.52);
    display: flex; align-items: center; justify-content: center;
  }
  .onboarding-box {
    background: white; border-radius: 20px;
    padding: 28px 24px 22px;
    width: min(320px, 88vw);
    box-shadow: 0 8px 32px rgba(0,0,0,0.22);
  }
  .onboarding-title {
    font-size: 16px; font-weight: bold; color: #1a1a1a;
    text-align: center; margin-bottom: 18px;
  }
  .ob-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 12px; font-size: 13.5px; color: #3a3a3a; line-height: 1.5;
  }
  .ob-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
  .ob-close-btn {
    display: block; width: 100%; margin-top: 22px;
    padding: 13px; border: none; border-radius: 12px;
    background: #4a90a4; color: white;
    font-size: 15px; font-weight: bold; font-family: inherit;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>

<!-- 상단 바 -->
<div class="top-bar">
  <a href="index.html" class="top-back">← 홈</a>
  <span class="top-title">국제차문화대전 부스배치도</span>
  <button class="top-search-btn" id="searchToggle" title="검색">🔍</button>
  <button class="top-dark-btn" id="darkToggle" onclick="toggleDark()" title="다크 모드 전환"></button>
</div>

<!-- 데스크탑 권장 안내 -->
<div class="desktop-notice">PC 환경에서 더 쾌적하게 이용하실 수 있습니다</div>

<!-- 검색 패널 -->
<div class="search-panel" id="searchPanel">
  <input type="text" id="searchInput" placeholder="부스번호 또는 업체명 검색..." autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<!-- 지도 -->
<div class="map-area" id="mapArea">
  <div class="map-mover" id="mapMover">
    <div id="svgLoading">지도 불러오는 중...</div>
  </div>
</div>

<!-- 바텀 시트 -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="bs-handle"></div>
  <div class="bs-meta">
    <span class="bs-zone-tag" id="bsZoneTag">A존</span>
    <span class="bs-id" id="bsId">A1</span>
  </div>
  <div class="bs-name" id="bsName">부스명</div>
  <div class="bs-actions">
    <button class="bs-btn" id="bsBtn" onclick="toggleFromSheet()">☆ 찜하기</button>
    <button class="bs-btn" id="bsVisitBtn" onclick="toggleVisitFromSheet()">방문완료</button>
  </div>
  <div class="bs-memo-label">메모</div>
  <textarea class="bs-memo" id="bsMemo" placeholder="이 부스에 대한 메모를 남겨보세요" oninput="saveMemoFromSheet()"></textarea>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openWishlist()">
  <span class="fab-icon">🍵</span>
  <span class="fab-badge" id="fabBadge">0</span>
</button>

<!-- 온보딩 안내 팝업 -->
<div class="onboarding-overlay" id="onboardingOverlay">
  <div class="onboarding-box">
    <div class="onboarding-title">사용 안내</div>
    <div class="ob-item">
      <span class="ob-icon">👆</span>
      <span>부스를 <b>탭</b>하면 업체명과 함께 <b>찜 · 방문완료 · 메모</b>를 남길 수 있습니다.</span>
    </div>
    <div class="ob-item">
      <span class="ob-icon">🤏</span>
      <span><b>핀치 줌</b>으로 지도를 확대·축소하고, 드래그로 이동합니다.</span>
    </div>
    <div class="ob-item">
      <span class="ob-icon">🔍</span>
      <span>우측 상단 <b>검색</b> 아이콘을 눌러 부스 번호나 업체명으로 검색합니다.</span>
    </div>
    <div class="ob-item">
      <span class="ob-icon">🍵</span>
      <span>하단 <b>찻잔 버튼</b>으로 방문 리스트를 확인하고 이미지로 저장합니다.</span>
    </div>
    <button class="ob-close-btn" onclick="closeOnboarding()">시작하기</button>
  </div>
</div>

<!-- 방문 리스트 드로어 -->
<div class="wishlist-drawer" id="wishlistDrawer">
  <div class="wd-header">
    <span class="wd-title">방문 리스트</span>
    <button class="wd-close" onclick="closeWishlist()">✕</button>
  </div>
  <div class="wd-list" id="wdList">
    <div class="wd-empty">부스를 탭하면<br>여기에 추가돼요</div>
  </div>
  <div class="wd-actions">
    <button class="wd-btn wd-btn-share" id="wdBtnShare" onclick="shareList()" disabled>📤 공유하기</button>
    <button class="wd-btn wd-btn-copy" id="wdBtnCopy" onclick="copyList()" disabled>📋 텍스트 복사</button>
    <button class="wd-btn wd-btn-save" id="wdBtnSave" onclick="saveAsImage()" disabled>🖼 이미지 저장</button>
    <button class="wd-btn wd-btn-clear" id="wdBtnClear" onclick="clearAll()" disabled>전체 취소</button>
  </div>
</div>

<script>
// ============================================================
// BOOTH DATA
// ============================================================
const boothData = {
  "A1":"무유다원","A2":"완도 청해진다원","A3":"현암제다","A4":"한국제다",
  "A5":"제주차농 JEJU CHANONG","A6":"차인연합회",
  "A7":"(사)세계기독교차문화협회/ 일양차문화연구원 회원 티플라워(다화) 전시회",
  "A8":"휘계차","A9":"공부차파크 복합치유공간 (과천 청계산점)","A10":"국제통상",
  "A11":"무유장작가마 살래요","A12":"명인신광수차_무드를 즐기는차(moocha)",
  "A13":"모후실에서만난차","A14":"백자일상","A15":"문경칠봉산농원",
  "A16":"동국대학교 불교대학원 차문화콘텐츠학과","A17":"가헌아트",
  "A18":"순천대학교 (사)고려천태국제선차 연구보존회","A19":"장흥청태전(장흥다원)",
  "A20":"동원공방","A21":"한국토기","A22":"헬스베버리지","A23":"문재필 옻칠갤러리",
  "A24":"경주 남촌도예","A25":"트임&김진욱도예원","A26":"매원초가",
  "A27":"연으로 만드는 힐링푸드 두레연구품당","A28":"귀단요 성탄송운",
  "A29":"토라","A30":"언담","A31":"정가로이","A32":"우기원",
  "A33":"안동착한농장 프로폴리스 茶","A34":"옻칠채","A35":"와락공방",
  "A36":"대림목공예","A37":"자연으로 옹크씨","A38":"주앤안 (이든갤러리)",

// ============================================================
// STATE
// ============================================================
const wishlist = new Map();
const visited  = new Set();
const memos    = new Map();
let currentBoothId = null;
let svgReady = false;

function saveWishlist() {
  localStorage.setItem('wishlist', JSON.stringify([...wishlist]));
}
function saveVisited() {
  localStorage.setItem('visited', JSON.stringify([...visited]));
}
function saveMemos() {
  localStorage.setItem('memos', JSON.stringify([...memos]));
}

function loadWishlist() {
  try {
    JSON.parse(localStorage.getItem('wishlist') || '[]').forEach(([id, name]) => {
      wishlist.set(id, name);
      const el = document.getElementById('b-' + id);
      if (el) el.classList.add('selected');
    });
  } catch(e) {}
  try {
    JSON.parse(localStorage.getItem('visited') || '[]').forEach(id => {
      visited.add(id);
      const el = document.getElementById('b-' + id);
      if (el) el.classList.add('visited');
    });
  } catch(e) {}
  try {
    JSON.parse(localStorage.getItem('memos') || '[]').forEach(([id, text]) => {
      if (text) memos.set(id, text);
    });
  } catch(e) {}
  new Set([...visited, ...memos.keys()]).forEach(updateBoothMarkers);
  if (wishlist.size > 0) refreshFab();
}

// 부스 위 방문완료 ✓ 배지 + 메모 점 마커
function updateBoothMarkers(id) {
  const rect = document.getElementById('b-' + id);
  if (!rect) return;
  const svg = rect.ownerSVGElement;
  svg.querySelectorAll(`[data-marker-for="${id}"]`).forEach(m => m.remove());

  const x = parseFloat(rect.getAttribute('x'));
  const y = parseFloat(rect.getAttribute('y'));
  const w = parseFloat(rect.getAttribute('width'));
  const NS = 'http://www.w3.org/2000/svg';

  if (visited.has(id)) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('class', 'visited-badge');
    c.setAttribute('cx', x + w - 6); c.setAttribute('cy', y + 6);
    c.setAttribute('r', 6); c.setAttribute('fill', '#2e8b57');
    c.setAttribute('data-marker-for', id);
    svg.appendChild(c);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'visited-badge');
    t.setAttribute('x', x + w - 6); t.setAttribute('y', y + 6.5);
    t.setAttribute('font-size', '8'); t.setAttribute('fill', 'white');
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
    t.setAttribute('data-marker-for', id);
    t.textContent = '✓';
    svg.appendChild(t);
  }
  if (memos.has(id)) {
    const d = document.createElementNS(NS, 'circle');
    d.setAttribute('class', 'memo-dot');
    d.setAttribute('cx', x + 6); d.setAttribute('cy', y + 6);
    d.setAttribute('r', 3.5); d.setAttribute('fill', '#e8a13e');
    d.setAttribute('stroke', 'white'); d.setAttribute('stroke-width', '1');
    d.setAttribute('data-marker-for', id);
    svg.appendChild(d);
  }
}

// ============================================================
// SVG LOADING
// ============================================================
async function loadSvg() {
  try {
    const resp = await fetch('festival-map.html');
    const html = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const svgEl = doc.getElementById('mapSvg');
    if (!svgEl) throw new Error('SVG not found');

    // Let CSS control rendering size; keep viewBox
    svgEl.removeAttribute('width');
    svgEl.removeAttribute('height');
    svgEl.style.width  = '1325px';
    svgEl.style.height = '911px';

    document.getElementById('svgLoading').remove();
    document.getElementById('mapMover').appendChild(svgEl);

    svgReady = true;
    initTransform();
    loadWishlist();
  } catch(e) {
    document.getElementById('svgLoading').textContent = '지도 로드 실패. 새로고침해 주세요.';
  }
}

// ============================================================
// PAN / PINCH-ZOOM
// ============================================================
const mapArea  = document.getElementById('mapArea');
const mapMover = document.getElementById('mapMover');
const SVG_W = 1325, SVG_H = 911;

let scale = 1, tx = 0, ty = 0;
let activeTouches = {};
let lastPinchDist = null, lastPinchMid = null;
let tapStart = null, didDrag = false;

function initTransform() {
  const aw = mapArea.clientWidth;
  const ah = mapArea.clientHeight;
  // 높이 기준으로 fit → 세로가 꽉 차고 좌우로 탐색하는 방식
  scale = Math.max(aw / SVG_W, ah / SVG_H) * 0.92;
  tx = (aw - SVG_W * scale) / 2;
  ty = Math.max(4, (ah - SVG_H * scale) / 2);
  applyTransform(false);
}

function applyTransform(animate) {
  if (animate) mapMover.style.transition = 'transform 0.38s ease';
  else mapMover.style.transition = '';
  mapMover.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function clampPos(nx, ny) {
  const aw = mapArea.clientWidth, ah = mapArea.clientHeight;
  const pad = 80;
  return {
    x: clamp(nx, pad - SVG_W * scale, aw - pad),
    y: clamp(ny, pad - SVG_H * scale, ah - pad)
  };
}

function pinchDist(a, b) {
  return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
}

mapArea.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mapArea.classList.add('active');
  for (const t of e.changedTouches) activeTouches[t.identifier] = { x: t.clientX, y: t.clientY };

  if (e.touches.length === 1) {
    tapStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
    didDrag = false;
    lastPinchDist = null;
  } else if (e.touches.length === 2) {
    tapStart = null;
    lastPinchDist = pinchDist(e.touches[0], e.touches[1]);
    lastPinchMid  = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                      y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
  }
}, { passive: false });

mapArea.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const tArr = e.touches;

  if (tArr.length === 1) {
    const t    = tArr[0];
    const prev = activeTouches[t.identifier];
    if (prev) {
      const dx = t.clientX - prev.x, dy = t.clientY - prev.y;
      if (Math.hypot(dx, dy) > 5) didDrag = true;
      const c = clampPos(tx + dx, ty + dy);
      tx = c.x; ty = c.y;
      applyTransform(false);
    }
    activeTouches[t.identifier] = { x: t.clientX, y: t.clientY };

  } else if (tArr.length === 2) {
    const t0 = tArr[0], t1 = tArr[1];
    const dist = pinchDist(t0, t1);
    const mid  = { x: (t0.clientX + t1.clientX) / 2,
                   y: (t0.clientY + t1.clientY) / 2 };

    if (lastPinchDist && lastPinchMid) {
      const ratio    = dist / lastPinchDist;
      const newScale = clamp(scale * ratio, 0.18, 3.5);
      const sf       = newScale / scale;
      tx = mid.x - (mid.x - tx) * sf + (mid.x - lastPinchMid.x);
      ty = mid.y - (mid.y - ty) * sf + (mid.y - lastPinchMid.y);
      scale = newScale;
      const c = clampPos(tx, ty); tx = c.x; ty = c.y;
      applyTransform(false);
      didDrag = true;
    }
    lastPinchDist = dist; lastPinchMid = mid;
    activeTouches[t0.identifier] = { x: t0.clientX, y: t0.clientY };
    activeTouches[t1.identifier] = { x: t1.clientX, y: t1.clientY };
  }
}, { passive: false });

mapArea.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) delete activeTouches[t.identifier];
  if (e.touches.length < 2) lastPinchDist = null;
  mapArea.classList.remove('active');

  if (!didDrag && tapStart && e.changedTouches.length === 1) {
    const t  = e.changedTouches[0];
    const dx = t.clientX - tapStart.x, dy = t.clientY - tapStart.y;
    if (Math.hypot(dx, dy) < 12 && Date.now() - tapStart.t < 320) {
      handleTap(tapStart.x, tapStart.y);
    }
  }
  tapStart = null;
}, { passive: false });

function handleTap(cx, cy) {
  if (!svgReady) return;
  const el = document.elementFromPoint(cx, cy);
  if (!el) { hideBottomSheet(); return; }

  // Walk up DOM for booth-rect
  let node = el, found = null;
  for (let i = 0; i < 6; i++) {
    if (!node || node === document.body) break;
    if (node.id && node.id.startsWith('b-') &&
        node.classList && node.classList.contains('booth-rect')) {
      found = node; break;
    }
    node = node.parentElement;
  }

  if (found) {
    const id = found.id.slice(2);
    if (boothData[id]) { showBottomSheet(id); return; }
  }
  hideBottomSheet();
}

// BOTTOM SHEET
// ============================================================
function showBottomSheet(id) {
  // 검색 패널이 열려 있으면 닫기 (겹침 방지)
  const sp = document.getElementById('searchPanel');
  if (sp.classList.contains('open')) {
    sp.classList.remove('open');
    document.getElementById('mapArea').classList.remove('search-open');
    document.getElementById('searchInput').value = '';
    clearHighlights();
  }
  currentBoothId = id;
  const zone = id[0];
  const color = ZONE_COLORS[zone] || '#aaa';

  document.getElementById('bsZoneTag').textContent = zone + '존';
  document.getElementById('bsZoneTag').style.background = color;
  document.getElementById('bsId').textContent = '부스 ' + id;
  document.getElementById('bsName').textContent = boothData[id] || id;
  document.getElementById('bsMemo').value = memos.get(id) || '';
  refreshBsBtn(id);
  refreshBsVisitBtn(id);
  document.getElementById('bottomSheet').classList.add('open');
  document.getElementById('fab').style.opacity = '0';
  document.getElementById('fab').style.pointerEvents = 'none';
}

function hideBottomSheet() {
  document.getElementById('bottomSheet').classList.remove('open');
  currentBoothId = null;
  document.getElementById('fab').style.opacity = '';
  document.getElementById('fab').style.pointerEvents = '';
}

// 바텀 시트 끌어내려 닫기 (메모·버튼 영역은 제외)
(function() {
  const sheet = document.getElementById('bottomSheet');
  let startY = null, dy = 0, dragging = false;

  sheet.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { dragging = false; return; }
    if (e.target.closest('.bs-btn, .bs-memo')) { dragging = false; return; } // 입력/버튼 우선
    startY = e.touches[0].clientY; dy = 0; dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  sheet.addEventListener('touchmove', (e) => {
    if (!dragging || startY === null) return;
    dy = e.touches[0].clientY - startY;
    const shift = dy < 0 ? Math.max(dy * 0.3, -16) : dy; // 위로는 저항
    sheet.style.transform = 'translateY(' + shift + 'px)';
  }, { passive: true });

  sheet.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (dy > 80) hideBottomSheet(); // 충분히 내리면 닫기
    startY = null; dy = 0;
  });
})();

    btn.textContent = '☆ 찜하기';

}

function refreshBsVisitBtn(id) {
  const btn = document.getElementById('bsVisitBtn');
  if (visited.has(id)) {
    btn.textContent = '✓ 방문완료';
    btn.className = 'bs-btn visit-on';
  } else {
    btn.textContent = '방문완료';
    btn.className = 'bs-btn visit-off';
  }
}

function toggleVisitFromSheet() {
  if (!currentBoothId) return;
  const id = currentBoothId;
  const el = document.getElementById('b-' + id);
  if (visited.has(id)) { visited.delete(id); if (el) el.classList.remove('visited'); }
  else                 { visited.add(id);    if (el) el.classList.add('visited'); }
  saveVisited();
  updateBoothMarkers(id);
  refreshBsVisitBtn(id);
}

function saveMemoFromSheet() {
  if (!currentBoothId) return;
  const id = currentBoothId;
  const text = document.getElementById('bsMemo').value.trim();
  if (text) memos.set(id, text);
  else      memos.delete(id);
  saveMemos();
  updateBoothMarkers(id);
}

function toggleFromSheet() {
  if (!currentBoothId) return;
  const id = currentBoothId;
  const el = document.getElementById('b-' + id);
  if (wishlist.has(id)) {
    wishlist.delete(id);
    if (el) el.classList.remove('selected');
  } else {
    wishlist.set(id, boothData[id]);
    if (el) el.classList.add('selected');
  }
  saveWishlist();
  refreshBsBtn(id);
  refreshFab();
}

// ============================================================
// FAB & WISHLIST DRAWER
// ============================================================
function refreshFab() {
  const n = wishlist.size;
  const badge = document.getElementById('fabBadge');
  badge.textContent = n;
  badge.classList.toggle('visible', n > 0);
}

function openWishlist() {
  renderWishlistDrawer();
  document.getElementById('wishlistDrawer').classList.add('open');
}

function closeWishlist() {
  document.getElementById('wishlistDrawer').classList.remove('open');
}

function sortedWishlist() {
  return [...wishlist.entries()].sort(([a], [b]) => {
    if (a[0] !== b[0]) return a[0].localeCompare(b[0]);
    return parseInt(a.slice(1)) - parseInt(b.slice(1));
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderWishlistDrawer() {
  const list   = document.getElementById('wdList');
  const btnSav = document.getElementById('wdBtnSave');
  const btnClr = document.getElementById('wdBtnClear');
  const btnShr = document.getElementById('wdBtnShare');
  const btnCpy = document.getElementById('wdBtnCopy');
  btnSav.disabled = wishlist.size === 0;
  btnShr.disabled = wishlist.size === 0;
  btnCpy.disabled = wishlist.size === 0;
  btnClr.disabled = (wishlist.size + visited.size + memos.size) === 0;

  if (wishlist.size === 0) {
    list.innerHTML = '<div class="wd-empty">부스를 탭하면<br>여기에 추가돼요</div>';
    return;
  }

  let html = '';
  sortedWishlist().forEach(([id, name]) => {
    const zone  = id[0];
    const color = ZONE_COLORS[zone] || '#aaa';
    let status = '';
    if (visited.has(id)) status += '<span style="color:#2e8b57;font-size:12px;margin-right:4px">✓</span>';
    if (memos.has(id))   status += '<span style="color:#e8a13e;font-size:12px">●</span>';
    const memo = memos.get(id);
    const memoHtml = memo ? `<div class="wd-item-memo">${escapeHtml(memo)}</div>` : '';
    html += `<div class="wd-item" onclick="panToBoothFromDrawer('${id}')">
      <div class="wd-zone-dot" style="background:${color}">${zone}</div>
      <div class="wd-info">
        <div class="wd-item-id">${id} ${status}</div>
        <div class="wd-item-name">${name}</div>
        ${memoHtml}
      </div>
      <span class="wd-remove" onclick="event.stopPropagation();removeItem('${id}')">✕</span>
    </div>`;
  });
  list.innerHTML = html;
}

function removeItem(id) {
  wishlist.delete(id);
  const el = document.getElementById('b-' + id);
  if (el) el.classList.remove('selected');
  saveWishlist();
  refreshFab();
  renderWishlistDrawer();
  if (currentBoothId === id) refreshBsBtn(id);
}

function clearAll() {
  if (wishlist.size + visited.size + memos.size === 0) return;
  if (!confirm('찜 · 방문완료 · 메모를 모두 지울까요?')) return;
  document.querySelectorAll('.booth-rect.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.booth-rect.visited').forEach(el => el.classList.remove('visited'));
  document.querySelectorAll('#mapSvg [data-marker-for]').forEach(m => m.remove());
  wishlist.clear();
  visited.clear();
  memos.clear();
  saveWishlist();
  saveVisited();
  saveMemos();
  refreshFab();
  renderWishlistDrawer();
  hideBottomSheet();
}

function panToBoothFromDrawer(id) {
  closeWishlist();
  setTimeout(() => panToBooth(id, true), 100);
}

function panToBooth(id, showSheet) {
  const el = document.getElementById('b-' + id);
  if (!el) return;

  const bbox = el.getBBox();
  const bx   = bbox.x + bbox.width  / 2;
  const by   = bbox.y + bbox.height / 2;
  const aw   = mapArea.clientWidth;
  const ah   = mapArea.clientHeight;

  const targetScale = clamp(Math.max(scale, 0.85), 0.5, 2.2);
  const newTx = aw / 2 - bx * targetScale;
  const newTy = ah / 2 - by * targetScale;
  const c = clampPos(newTx, newTy);

  scale = targetScale; tx = c.x; ty = c.y;
  applyTransform(true);
  setTimeout(() => { mapMover.style.transition = ''; }, 420);

  if (showSheet) {
    setTimeout(() => {
      el.style.filter = 'brightness(0.5)';
      setTimeout(() => { el.style.filter = ''; }, 380);
      if (boothData[id]) showBottomSheet(id);
    }, 420);
  }
}

// ============================================================
// SEARCH
// ============================================================
let searchDebounce = null;
document.getElementById('searchToggle').addEventListener('click', () => {
  const panel = document.getElementById('searchPanel');
  const area  = document.getElementById('mapArea');
  const open  = panel.classList.toggle('open');
  area.classList.toggle('search-open', open);
  if (open) {
    hideBottomSheet();   // 검색과 부스 상세가 겹치지 않도록 (좁은/가로 화면 대비)
    setTimeout(() => document.getElementById('searchInput').focus(), 220);
  } else {
    document.getElementById('searchInput').value = '';
    clearHighlights();
  }
});

document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => handleSearch(this.value), 280);
});

// 엔터 키: 키보드 닫힌 후 viewport가 확정되면 다시 pan
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const q = this.value;
    this.blur();                           // 가상 키보드 닫기
    clearTimeout(searchDebounce);
    setTimeout(() => handleSearch(q), 380); // viewport 재확정 후 pan
  }
});

function clearHighlights() {
  document.querySelectorAll('.booth-rect.highlight').forEach(el => el.classList.remove('highlight'));
}

function handleSearch(q) {
  clearHighlights();
  if (!q.trim()) return;
  const lq = q.trim().toLowerCase();
  let first = null;
  for (const [id, name] of Object.entries(boothData)) {
    if (id.toLowerCase().includes(lq) || name.toLowerCase().includes(lq)) {
      const el = document.getElementById('b-' + id);
      if (el) { el.classList.add('highlight'); if (!first) first = id; }
    }
  }
  if (first) panToBooth(first, false);
}

// ============================================================
// SHARE / COPY LIST
// ============================================================
function buildListText() {
  const lines = ['🍵 제23회 국제차문화대전 방문 리스트', ''];
  sortedWishlist().forEach(([id, name]) => {
    lines.push(`[${id}] ${name}`);
    const memo = memos.get(id);
    if (memo) lines.push(memo);
    lines.push('');
  });
  return lines.join('\n').trim() + '\n\n출처: linktr.ee/jadeafraid';
}

function flashBtn(btn, msg) {
  const orig = btn.textContent;
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = orig; }, 1500);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
    return ok;
  }
}

async function copyList() {
  if (wishlist.size === 0) return;
  const ok = await copyToClipboard(buildListText());
  flashBtn(document.getElementById('wdBtnCopy'), ok ? '✅ 복사됨!' : '복사 실패');
}

async function shareList() {
  if (wishlist.size === 0) return;
  const text = buildListText();
  if (navigator.share) {
    try {
      await navigator.share({ title: '국제차문화대전 방문 리스트', text });
    } catch (e) { /* 사용자 취소 등은 무시 */ }
  } else {
    const ok = await copyToClipboard(text);
    flashBtn(document.getElementById('wdBtnShare'), ok ? '✅ 복사됨!' : '복사 실패');
  }
}

// ============================================================
// SAVE AS IMAGE (동일 로직, mapSvg fetch에서 주입된 SVG 사용)
// ============================================================
async function saveAsImage() {
  const btn = document.getElementById('wdBtnSave');
  btn.textContent = '⏳ 저장 중...';
  btn.disabled = true;

  try {
    const svg = document.getElementById('mapSvg');
    if (!svg) throw new Error('SVG 없음');
    const svgClone = svg.cloneNode(true);

    // 선택된 부스 스타일 주입
    const svgStyle = svgClone.querySelector('style');
    if (svgStyle) {
      svgStyle.textContent += '\n.booth-rect.selected { fill: #ff6b35 !important; stroke: #c0392b !important; stroke-width: 2 !important; }';
    }

    const svgW = 1325, svgH = 911;
    const panelX = svgW + 10, panelW = 300;
    const totalW = svgW + panelW + 20;
    const memoCount = [...wishlist.keys()].filter(id => memos.has(id)).length;
    const totalH = Math.max(svgH, wishlist.size * 20 + memoCount * 14 + 80);

    svgClone.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
    svgClone.setAttribute('width',   totalW);
    svgClone.setAttribute('height',  totalH);

    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', panelX); bg.setAttribute('y', 0);
    bg.setAttribute('width', panelW); bg.setAttribute('height', totalH);
    bg.setAttribute('fill', '#fff'); bg.setAttribute('rx', '6');
    svgClone.appendChild(bg);

    const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    title.setAttribute('x', panelX + 14); title.setAttribute('y', 34);
    title.setAttribute('font-size', '14'); title.setAttribute('font-weight', 'bold');
    title.setAttribute('fill', '#2c2c2c');
    title.setAttribute('font-family', 'Apple SD Gothic Neo, Malgun Gothic, sans-serif');
    title.textContent = `방문 리스트 (${wishlist.size}곳)`;
    svgClone.appendChild(title);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', panelX+10); line.setAttribute('y1', 44);
    line.setAttribute('x2', panelX+panelW-10); line.setAttribute('y2', 44);
    line.setAttribute('stroke', '#eee'); line.setAttribute('stroke-width', '1');
    svgClone.appendChild(line);

    let yPos = 66;
    sortedWishlist().forEach(([id, name]) => {
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', panelX+20); dot.setAttribute('cy', yPos-4);
      dot.setAttribute('r', 5); dot.setAttribute('fill', '#ff6b35');
      svgClone.appendChild(dot);

      const idText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      idText.setAttribute('x', panelX+32); idText.setAttribute('y', yPos);
      idText.setAttribute('font-size', '10'); idText.setAttribute('fill', '#6aaa6a');
      idText.setAttribute('font-weight', 'bold');
      idText.setAttribute('font-family', 'Apple SD Gothic Neo, Malgun Gothic, sans-serif');
      idText.textContent = id;
      svgClone.appendChild(idText);

      const nameText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      nameText.setAttribute('x', panelX+62); nameText.setAttribute('y', yPos);
      nameText.setAttribute('font-size', '10'); nameText.setAttribute('fill', '#333');
      nameText.setAttribute('font-family', 'Apple SD Gothic Neo, Malgun Gothic, sans-serif');
      nameText.textContent = name.length > 16 ? name.slice(0, 15) + '…' : name;
      svgClone.appendChild(nameText);

      // 방문완료 표시
      if (visited.has(id)) {
        const chk = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        chk.setAttribute('x', panelX+panelW-16); chk.setAttribute('y', yPos);
        chk.setAttribute('font-size', '11'); chk.setAttribute('fill', '#2e8b57');
        chk.setAttribute('font-weight', 'bold');
        chk.textContent = '✓';
        svgClone.appendChild(chk);
      }

      yPos += 20;

      // 메모 한 줄
      const memo = memos.get(id);
      if (memo) {
        const memoText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        memoText.setAttribute('x', panelX+32); memoText.setAttribute('y', yPos-6);
        memoText.setAttribute('font-size', '9'); memoText.setAttribute('fill', '#999');
        memoText.setAttribute('font-family', 'Apple SD Gothic Neo, Malgun Gothic, sans-serif');
        const oneLine = memo.replace(/\s*\n\s*/g, ' ');
        memoText.textContent = '✎ ' + (oneLine.length > 26 ? oneLine.slice(0, 25) + '…' : oneLine);
        svgClone.appendChild(memoText);
        yPos += 14;
      }
    });

    // 출처
    const credit = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    credit.setAttribute('x', panelX + 14); credit.setAttribute('y', totalH - 16);
    credit.setAttribute('font-size', '10'); credit.setAttribute('fill', '#aaa');
    credit.setAttribute('font-family', 'Apple SD Gothic Neo, Malgun Gothic, sans-serif');
    credit.textContent = '출처: linktr.ee/jadeafraid';
    svgClone.appendChild(credit);

    const serializer = new XMLSerializer();
    const svgStr  = serializer.serializeToString(svgClone);
    const svgBlob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width  = totalW * 1.5;
      canvas.height = totalH * 1.5;
      const ctx = canvas.getContext('2d');
      ctx.scale(1.5, 1.5);
      ctx.fillStyle = '#f5f0e8';
      ctx.fillRect(0, 0, totalW, totalH);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'TEA_FESTIVAL_방문리스트.png';
        a.click();
        URL.revokeObjectURL(a.href);
        btn.textContent = '✅ 저장 완료!';
        setTimeout(() => {
          btn.textContent = '🖼 이미지 저장';
          btn.disabled = wishlist.size === 0;
        }, 2000);
      }, 'image/png');
    };
    img.onerror = () => {
      btn.textContent = '🖼 이미지 저장';
      btn.disabled = false;
    };
    img.src = url;
  } catch(e) {
    document.getElementById('wdBtnSave').textContent = '🖼 이미지 저장';
    document.getElementById('wdBtnSave').disabled = false;
  }
}
